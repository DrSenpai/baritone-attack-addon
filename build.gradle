plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.18'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

tasks.named('jar') {
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}.jar"
}

repositories {
    maven { url = uri("https://maven.fabricmc.net/") }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Put the exact Baritone 26.2 JAR from your instance in ./libs/
    compileOnly files("libs/baritone-fabric-26.2-SNAPSHOT.jar")
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
