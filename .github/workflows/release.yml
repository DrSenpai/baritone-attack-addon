name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag
        shell: bash
        run: |
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$TAG_VERSION" != "$MOD_VERSION" ]]; then
            echo "Tag version '$TAG_VERSION' does not match mod_version '$MOD_VERSION'." >&2
            exit 1
          fi

          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"
          echo "MINECRAFT_VERSION=$MINECRAFT_VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/libs/baritone-attack-addon-${{ env.MOD_VERSION }}-mc${{ env.MINECRAFT_VERSION }}.jar
